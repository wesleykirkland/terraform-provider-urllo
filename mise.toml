[tools]
# Kept in sync by hand with: go.mod's `go` directive, the Terraform version
# used by every mise-based CI job (test.yml's "unit"/"generate", terraform.yml's
# "test"/"terraform", release.yml's "goreleaser" -- test.yml's acceptance-test
# matrix job is the one exception, intentionally overriding this per-leg via
# hashicorp/setup-terraform instead, since it needs several concrete Terraform
# CLI versions side by side), and the ruff/coverage pins also used by
# scripts/run_python_tests.py's CI step. `node` is used by semantic-release.yml
# only, to run the semantic-release CLI (see package.json).
go = "1.25.8"
golangci-lint = "2.12"
terraform = "1.15"
node = "24" # Only LTS versions are supported

# Python
python = "3"
ruff = "0.16.0"
"pipx:coverage" = "7.15.2"
