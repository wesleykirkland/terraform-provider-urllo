# Warns (does not fail this workflow or block the PR) when the live Urllo
# OpenAPI spec has moved past the version this provider was built against.
# Urllo doesn't publish an API changelog, so this is the only signal we get
# that upstream may have changed something worth reviewing. Split into its
# own workflow file (rather than a job in test.yml) since it checks an
# external, independently-changing resource rather than this repo's own
# correctness.
name: API Spec Drift

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  # GitHub Actions cron always runs in UTC, which doesn't shift for DST, so
  # this is pinned to 10:00 UTC (6 AM EDT). During EST (roughly early
  # November - mid March) this runs at 5 AM ET instead of 6 AM.
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

# Only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  api-spec-drift:
    name: API spec drift check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: check-api-spec
        # `continue-on-error` is a second layer on top of the script itself
        # always exiting 0 (see scripts/check_api_spec_version.py), so a
        # live-spec outage or a transient network failure on the runner
        # can't turn this into a required-check failure either.
        run: make check-api-spec
        continue-on-error: true
