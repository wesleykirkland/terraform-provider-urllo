# Terraform CI for the ./terraform example, adapted from
# https://github.com/wesleykirkland/wesleyk.me/blob/main/.github/workflows/terraform.yml
#
# Flow: run all Go tests -> build the provider from source into a local
# filesystem mirror (so `terraform init` resolves it without a registry) ->
# terraform plan (and, on merge/label/dispatch, apply) via tf-via-pr, which
# comments the plan on the PR.
#
# Required repository secrets:
#   URLLO_API_KEY, URLLO_API_SECRET  - to plan/apply against a real account.
#   TF_PLAN_PASSPHRASE (optional)     - encrypts the saved plan artifact.
#
# Note: the example uses local (ephemeral) state and only reads data sources, so
# apply is a no-op today. Configure a remote backend before managing real
# resources across runs.
name: Terraform

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'internal/**'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/terraform.yml'
    types: [opened, synchronize, reopened, labeled] # label triggers a manual plan/apply
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'internal/**'
      - '**/*.go'
  workflow_dispatch:
    inputs:
      command:
        description: TF command
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  contents: read # checkout

env:
  TF_WORKING_DIR: ./terraform
  PROVIDER_VERSION: 0.0.1

jobs:
  # Run the full Go test suite (unit + mock-backed acceptance) as a gate.
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Utilize mise for CI and local; go + terraform are pinned in
      # mise.toml. Unlike hashicorp/setup-terraform, mise puts the raw
      # terraform binary on PATH with no wrapper, which is what the mock
      # acceptance tests need (equivalent to terraform_wrapper: false).
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: go vet ./...
      - name: Run all tests
        run: TF_ACC=1 go test -race -cover ./...

  terraform:
    name: Build provider & Terraform
    needs: test
    runs-on: ubuntu-latest
    permissions:
      actions: read # identify workflow run
      checks: write # status summary
      contents: read # checkout
      issues: write # manage PR labels
      pull-requests: write # PR comment
      security-events: write # upload SARIF
    # Skip labeled events that don't carry a TF label.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.action != 'labeled' ||
      contains(github.event.pull_request.labels.*.name, 'run-plan') ||
      contains(github.event.pull_request.labels.*.name, 'run-apply')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Utilize mise for CI and local; go + terraform are pinned in
      # mise.toml. Unlike hashicorp/setup-terraform, mise puts the raw
      # terraform binary on PATH with no wrapper, which is what tf-via-pr
      # needs for detailed exit codes (equivalent to terraform_wrapper: false).
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # Build the provider from source into Terraform's implied local mirror and
      # write a CLI config so init resolves it from there (never the registry).
      - name: Build provider into local mirror
        run: |
          ./terraform/build-local.sh "${PROVIDER_VERSION}"
          printf 'provider_installation {\n  filesystem_mirror {\n    path    = "%s/.terraform.d/plugins"\n    include = ["registry.terraform.io/wesleykirkland/urllo"]\n  }\n  direct {\n    exclude = ["registry.terraform.io/wesleykirkland/urllo"]\n  }\n}\n' "$HOME" > "$RUNNER_TEMP/mirror.tfrc"
          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/mirror.tfrc" >> "$GITHUB_ENV"

      # Security scanning — runs on every event except label-only triggers.
      - name: Run Checkov
        if: github.event.action != 'labeled'
        uses: bridgecrewio/checkov-action@59b9d7edfcad5b87fbe3f473a9a134a721ad03f8 # v12.3119.0
        with:
          directory: ${{ env.TF_WORKING_DIR }}
          framework: terraform
          output_format: sarif
        continue-on-error: true

      - name: Upload Checkov results
        if: github.event.action != 'labeled' && always() && hashFiles('terraform-checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: terraform-checkov.sarif
          category: checkov
        continue-on-error: true

      # tfsec is deprecated -- upstream (Aqua Security) folded it into Trivy,
      # and tfsec's own release assets stopped publishing, breaking the old
      # action outright. `scan-type: config` is Trivy's equivalent
      # misconfiguration/IaC scan (the successor to what tfsec did).
      - name: Run Trivy (Terraform config scan)
        if: github.event.action != 'labeled'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ env.TF_WORKING_DIR }}
          format: sarif
          output: terraform-trivy.sarif
          exit-code: '0'
        continue-on-error: true

      - name: Upload Trivy results
        if: github.event.action != 'labeled' && always() && hashFiles('terraform-trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: terraform-trivy.sarif
          category: trivy
        continue-on-error: true

      # Apply is temporarily disabled -- always plan, regardless of trigger.
      # To re-enable, restore the commented-out command/arg-lock expressions
      # below (which resolve to 'apply' on push to main, the run-apply label,
      # or a workflow_dispatch command=apply input) in place of the
      # hardcoded values.
      - name: Provision TF
        uses: op5dev/tf-via-pr@39ed2635c056ca408ed24cc5c2baf0ef4381a7a5 # v13
        env:
          TF_IN_AUTOMATION: true
          TF_LOG: ERROR
          URLLO_API_KEY: ${{ secrets.URLLO_API_KEY }}
          URLLO_API_SECRET: ${{ secrets.URLLO_API_SECRET }}
        with:
          working-directory: ${{ env.TF_WORKING_DIR }}
          command: plan
          # command: >-
          #   ${{ inputs.command ||
          #       (github.event_name == 'push' && 'apply') ||
          #       (contains(github.event.pull_request.labels.*.name, 'run-apply') && 'apply') ||
          #       'plan' }}
          arg-lock: false
          # arg-lock: >-
          #   ${{ inputs.command == 'apply' ||
          #       github.event_name == 'push' ||
          #       contains(github.event.pull_request.labels.*.name, 'run-apply') }}
          plan-encrypt: ${{ secrets.TF_PLAN_PASSPHRASE }}
          validate: true
          format: true
          expand-diff: true
          comment-pr: always
          retention-days: 30

      - name: Remove label
        if: |
          always() && (
            contains(github.event.pull_request.labels.*.name, 'run-plan') ||
            contains(github.event.pull_request.labels.*.name, 'run-apply')
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          PR_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-plan') && 'run-plan' || 'run-apply' }}
        run: gh api /repos/{owner}/{repo}/issues/${PR_NUMBER}/labels/${PR_LABEL} --method DELETE
