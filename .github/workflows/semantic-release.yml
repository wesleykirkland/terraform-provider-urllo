# Manually-triggered semantic release.
#
# Run manually from the Actions tab (workflow_dispatch) when main is ready
# to be released -- it no longer runs automatically on push. The job only
# runs when dispatched against main (see the job's `if`), since the Actions
# UI otherwise lets you dispatch from any branch. It delegates the whole
# release decision to the `semantic-release` CLI (see package.json and
# .releaserc.json), which:
#   1. Computes the next version from the Conventional Commit history since
#      the last vX.Y.Z tag (fix -> patch, feat -> minor, "BREAKING CHANGE" /
#      "!" -> major; no relevant commits -> no-op, exits 0).
#   2. Generates the changelog entry for those commits and prepends it to
#      CHANGELOG.md (@semantic-release/release-notes-generator +
#      @semantic-release/changelog).
#   3. Commits that file to main (as wesleykirkland-release-bot[bot]) and
#      tags/pushes it as vX.Y.Z (@semantic-release/git plus semantic-release
#      core, which owns the actual git tag + push).
# `.releaserc.json` deliberately excludes @semantic-release/github: pushing
# the tag triggers the existing GoReleaser workflow (release.yml), which
# builds and publishes the signed provider artifacts and (via
# .goreleaser.yml's changelog config) writes its own grouped notes to the
# GitHub Release body, independent of CHANGELOG.md.
#
# The chore(release) commit itself does not trigger another release: it carries
# no feat:/fix:/! marker, so the next dry run computes no bump and the job
# no-ops. The `concurrency` group below serializes runs so that re-trigger
# always sees the tag/commit the previous run just pushed.
#
# Auth: this workflow mints its own token from the "wesleykirkland-release-bot"
# GitHub App (id: see APP_ID secret) rather than using a PAT. Two things a
# plain GITHUB_TOKEN can't do, which is why the App exists:
#   1. Tags/commits pushed with the default GITHUB_TOKEN do not trigger other
#      workflows, so release.yml (tag-triggered) would never run.
#   2. main is protected by a repository ruleset requiring PRs. The ruleset's
#      bypass_actors list explicitly allows this App (Integration, always) to
#      push directly, so the changelog commit + tag succeed without a PR.
#
# Required secrets:
#   CLIENT_ID       - the GitHub App's client ID (used to mint the token).
#   APP_ID          - the GitHub App's numeric ID (used only for the bot
#                      commit author's noreply email address).
#   APP_PRIVATE_KEY - the App's private key (PEM).
name: Semantic Release

on:
  workflow_dispatch:

# No repo-level permissions needed for GITHUB_TOKEN: every step below acts
# with the token minted from the GitHub App, scoped down below.
permissions: {}

# Avoid overlapping release runs.
concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag next version
    runs-on: ubuntu-latest
    # Manual dispatch can be run from any branch in the UI, but releases must
    # only ever be cut from main.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Generate App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Cap the minted token to exactly what this job does, independent of
          # whatever permissions the App itself is granted at the install level.
          permission-contents: write

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      # Utilize mise for CI and local; node is pinned in mise.toml solely to
      # run the semantic-release CLI below.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      # --ignore-scripts: none of the pinned packages need install-time
      # lifecycle scripts, so skip them rather than trust the dependency
      # tree to run arbitrary code during install.
      - run: npm ci --ignore-scripts

      - name: Configure git identity
        env:
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          APP_ID: ${{ secrets.APP_ID }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Release
        env:
          # Not required by the plugin set in .releaserc.json (no
          # @semantic-release/github), but harmless to pass through.
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        # --no-install: run the exact version `npm ci` just installed from
        # package-lock.json, rather than letting npx resolve/fetch anything.
        run: npx --no-install semantic-release
