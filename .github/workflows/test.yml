# Terraform Provider testing workflow.
name: Tests

# Runs on pull requests only: main is protected and only reachable via a
# merged PR, so a push to main is always a commit these checks already ran
# against and passed - re-running on push would just repeat that same result.
on:
  pull_request:
    paths-ignore:
      - 'README.md'

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Overrides the workflow-level contents:read default so this job can also
    # upload the Trivy secret-scan SARIF below.
    permissions:
      contents: read # checkout
      security-events: write # upload SARIF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Utilize mise for CI and local
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: go mod download
      - name: make build
        run: make build
      - name: make lint-py
        run: make lint-py
      # Equivalent to `make lint` (both just run `golangci-lint run`), but
      # via the action so lint findings get inline PR annotations + caching.
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
      # Same check pre-commit runs locally (see GNUmakefile's govulncheck
      # target and .githooks/pre-commit) -- CI is the authoritative
      # enforcement, pre-commit is the fast local mirror.
      - name: make govulncheck
        run: make govulncheck

      # Secret scanning -- repo-wide (not just terraform/, unlike the Trivy
      # config scan in terraform.yml), since a leaked credential can land in
      # any file type. Runs here rather than terraform.yml because this job
      # gates every PR (paths-ignore: README.md only); terraform.yml's
      # trigger paths are narrower.
      - name: Run Trivy (secret scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: secret
          scan-ref: .
          format: sarif
          output: repo-trivy-secrets.sarif
          exit-code: '0'
        continue-on-error: true

      - name: Upload Trivy secret-scan results
        if: always() && hashFiles('repo-trivy-secrets.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: repo-trivy-secrets.sarif
          category: trivy-secrets
        continue-on-error: true

  # Unit tests run on every push/PR and require no credentials. Acceptance tests
  # are gated behind TF_ACC, so they do not run here.
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
      code-quality: write # upload coverage report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarCloud needs full history for SCM blame / new-code analysis.
          fetch-depth: 0
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: go mod download
      # `make test` covers both `go vet ./...` and `go test -race -cover ./...`
      # (test depends on vet -- see GNUmakefile), so this is the same check a
      # contributor's pre-commit hook and `make test` run locally.
      - name: make test
        run: make test
      # Enforce a coverage floor. The mock-backed acceptance tests run without
      # credentials, so this covers the full CRUD path. See COVERAGE.md.
      - name: coverage gate
        run: make cover
      # Runs scripts/test_check_docs.py and writes a Cobertura-format
      # coverage.xml (see scripts/run_python_tests.py) alongside Go's
      # coverage.out, before the Sonar/Codecov steps below so both get picked
      # up in the same scan/upload.
      - name: make test-py
        run: make test-py
      # Feeds coverage.out (Go, from `make cover`) and coverage.xml (Python,
      # from `make test-py`) to SonarCloud so the "SonarCloud Code Analysis"
      # check posts on the PR. See sonar-project.properties for the
      # reportPaths wiring.
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      # Feeds coverage.out and coverage.xml to Codecov for PR coverage
      # reports; the uploader auto-detects both when `files:` isn't given.
      # fail_ci_if_error defaults to false, so a missing/bad CODECOV_TOKEN
      # warns rather than failing this required check.
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # go + terraform, pinned in mise.toml, are both needed for `make
      # generate` (tfplugindocs + `terraform fmt` on examples/).
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)
      # Backstop for scripts/check_docs.py: the pre-commit hook (.githooks/)
      # only runs once a contributor has run `make` at least once and hasn't
      # passed --no-verify, so this catches README drift regardless.
      - name: check-docs
        run: make check-docs

  # Run acceptance tests in a matrix with Terraform CLI versions. These require
  # Urllo credentials configured as repository secrets; without them the tests
  # skip themselves.
  #
  # Deliberately NOT using mise here, unlike the jobs above: this job needs
  # several distinct Terraform CLI versions across its matrix legs, which is
  # exactly what hashicorp/setup-terraform's terraform_version input is for.
  # mise.toml pins one static Terraform version for the other jobs' single,
  # fixed use case -- overriding it per matrix leg would need extra scripting
  # for no real benefit over the purpose-built action.
  test:
    name: 'Acceptance Tests: Terraform ${{ matrix.terraform }}'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Terraform versions
        terraform:
          - '1.13.*'
          - '1.14.*'
          - '1.15.*'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      # Deliberately not `make testacc`: that target runs `./...` at a 120m
      # timeout, which would needlessly re-run internal/client's tests (which
      # don't vary by Terraform CLI version) on every leg of this matrix.
      # Scoped to internal/provider/ with a shorter per-leg timeout instead.
      - env:
          TF_ACC: "1"
          URLLO_API_KEY: ${{ secrets.URLLO_API_KEY }}
          URLLO_API_SECRET: ${{ secrets.URLLO_API_SECRET }}
          URLLO_TEST_HOST: ${{ vars.URLLO_TEST_HOST }}
        run: go test -v -cover ./internal/provider/
        timeout-minutes: 10
